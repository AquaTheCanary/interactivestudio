<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading presentation | Interactive Studio</title></head><body><p>Loading presentation…</p><script>
(function(){
 const path=location.pathname;
 const match=path.match(/^(.*)\/view\/(\d{6})\/?$/);
 if(!match){location.replace((location.pathname.split("/").slice(0,2).join("/")||"")+"/");return}
 const base=location.hostname.endsWith(".github.io")?"/interactivestudio":"";
 fetch(base+"/view/index.html",{cache:"no-store"}).then(response=>{if(!response.ok)throw new Error("Viewer page unavailable");return response.text()}).then(html=>{
  html=html.replace("<head>","<head><base href=\""+base+"/\">");
  document.open();document.write(html);document.close();
 }).catch(error=>{document.body.textContent="Could not open this presentation: "+error.message;});
})();
</script></body></html>
