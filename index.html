<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Studio</title>
    <!-- Browser Tab Icon -->
    <link rel="icon" type="image/png" href="tablogo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="brand">
            <!-- Header Logo (Optimized for High-Res) -->
            <img src="logo.png" alt="Interactive Studio Logo" class="brand-logo">
            <span class="brand-name">Interactive Studio</span>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">Canvas</a></li>
                <li><a href="#">Tools</a></li>
                <li><a href="#">Downloads</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="workspace">
            <div class="workspace-header">
                <h1 class="workspace-title">Studio Environment</h1>
                <span class="badge">v1.0 Live</span>
            </div>
            
            <div class="canvas-preview">
                <div class="interactive-demo">
                    <h2 id="demo-heading">Interactive Studio</h2>
                    <p id="demo-subtext">Click below to test live state</p>
                </div>
            </div>

            <div class="action-bar">
                <button class="btn-primary" id="interact-btn">Run Action</button>
            </div>
        </section>

        <aside class="downloads-panel">
            <div class="panel-card">
                <h3>Native Apps</h3>
                <div class="download-list">
                    <a href="#" class="download-item">
                        <span>Windows Executable</span>
                        <span class="platform">.EXE</span>
                    </a>
                    <a href="#" class="download-item">
                        <span>macOS Installer</span>
                        <span class="platform">.DMG</span>
                    </a>
                    <a href="#" class="download-item">
                        <span>Android Package</span>
                        <span class="platform">.APK</span>
                    </a>
                </div>
            </div>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
