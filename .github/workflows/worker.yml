name: Deploy Interactive Studio Worker

on:
  push:
    branches:
      - main
    paths:
      - "assets/files/worker.js"
      - "assets/files/wrangler.toml"
      - "assets/files/package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interactive-studio-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN is missing or empty." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::GitHub Actions secret CLOUDFLARE_ACCOUNT_ID is missing or empty." && exit 1)

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: assets/files
          command: deploy
