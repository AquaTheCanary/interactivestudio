<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Account — Interactive Studio</title>
    <link rel="icon" type="image/png" href="../../tabletop.png">
    <link rel="stylesheet" href="../../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-header">
            <img src="../../logo.png" alt="Interactive Studio Logo" class="auth-logo">
            <h1 id="auth-title">Welcome Back</h1>
            <p id="auth-subtitle">Sign in to your personal Interactive Studio account</p>
        </div>

        <!-- Toggle Tabs for Login vs Register -->
        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login">Login</button>
            <button class="auth-tab" id="tab-register">Register</button>
        </div>

        <!-- SSO Providers -->
        <div class="sso-buttons">
            <button class="btn-sso google" id="google-auth-btn">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.87 0 11.7c0 1.83.43 3.58 1.19 5.12l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                Continue with Google
            </button>
            <button class="btn-sso microsoft" id="msft-auth-btn">
                <svg width="18" height="18" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
                Continue with Microsoft
            </button>
        </div>

        <div class="auth-divider"><span>or continue with email</span></div>

        <form id="auth-form" class="auth-form">
            <div class="input-group" id="name-group" style="display: none;">
                <label>Full Name</label>
                <input type="text" placeholder="Jane Doe" id="name-input">
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@example.com" id="email-input" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" id="password-input" required>
            </div>
            <button type="submit" class="btn-submit" id="submit-btn">Sign In</button>
        </form>

        <div class="auth-footer">
            <a href="../organisation/index.html">Switch to Organisation Login →</a>
        </div>
    </div>

    <script src="../../app.js"></script>
    <script src="auth.js"></script>
</body>
</html>
