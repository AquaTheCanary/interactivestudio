<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organisation Login | Interactive Studio</title>
    <link rel="icon" type="image/png" href="../../../tablogo.png">
    <link rel="stylesheet" href="../../../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../../../router.js"></script>
    <script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="../../../auth-config.js"></script>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <img src="../../../headerlogo.png" alt="Interactive Studio" class="auth-logo">
            <h1>Organisation Portal</h1>
            <p>Sign in using your company domain email</p>
        </div>

        <div class="sso-buttons">
            <button class="btn-sso" onclick="loginWithMicrosoft()">
                <svg width="18" height="18" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
                Sign in with Azure AD / Microsoft SSO
            </button>
        </div>

        <div class="auth-divider"><span>or corporate email</span></div>

        <form class="auth-form" id="org-login-form">
            <div class="input-group">
                <label>Work Email Address</label>
                <input type="email" id="org-email" placeholder="name@company.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="org-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Sign In to Organisation</button>
        </form>

        <div class="auth-footer">
            <p>Need an enterprise setup? <a data-route="/contact/setup/enterprise/">Request Enterprise</a></p>
        </div>
        <div class="back-link-wrap">
            <a data-route="/auth/personal/login/">← Switch to Personal Login</a>
        </div>
    </div>

    <script>
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const freeDomains = ['gmail.com', 'yahoo.com', 'hotmail.com', 'outlook.com', 'icloud.com', 'aol.com'];

        document.getElementById("org-login-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("org-email").value.trim().toLowerCase();
            const password = document.getElementById("org-password").value;
            const domain = email.split('@')[1];

            if (!domain || freeDomains.includes(domain)) {
                alert("Access Denied: Organisation Login requires a valid corporate work email domain (e.g. name@yourcompany.com). Free email providers are not permitted.");
                return;
            }

            auth.signInWithEmailAndPassword(email, password).then((cred) => {
                sessionStorage.setItem("is_user_plan", "Organisation");
                window.location.href = window.getAppUrl('/dashboard/');
            }).catch(err => alert("Organisation Auth Error: " + err.message));
        });
    </script>
</body>
</html>
