<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor | Interactive Studio</title>
    <link rel="icon" type="image/png" href="../tablogo.png">
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../router.js"></script>
</head>
<body class="page-body" style="overflow: hidden; height: 100vh; display: flex; flex-direction: column;">

    <header class="app-header" style="width: 100%;">
        <div class="nav-brand">
            <a data-route="/dashboard/"><img src="../headerlogo.png" alt="Interactive Studio" class="brand-logo"></a>
            <span class="project-title" contenteditable="true" style="font-weight: 600; font-size: 0.9rem; padding: 4px 8px; border: 1px dashed transparent; border-radius: 4px;">Untitled Presentation</span>
        </div>
        <div class="nav-actions">
            <span class="user-email-badge" style="background: #e6f4ea; color: #137333; border-color: #ceead6;">☁️ Saved to Cloud</span>
            <a data-route="/dashboard/" class="btn-secondary-small">Back to Dashboard</a>
        </div>
    </header>

    <div style="flex: 1; background: #f4f5f7; display: flex; align-items: center; justify-content: center; position: relative;">
        <!-- Figma-like Minimalist Workspace Canvas Placeholder -->
        <div style="width: 720px; height: 405px; background: #ffffff; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;">
            <img src="../headerlogo.png" alt="Logo" style="height: 36px; opacity: 0.8;">
            <p style="color: var(--text-sub); font-size: 0.9rem;">Interactive Canvas Area — Ready for components</p>
        </div>
    </div>

</body>
</html>
