<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub | Interactive Studio</title>
    <link rel="icon" type="image/png" href="../tablogo.png">
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../router.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="../auth-config.js"></script>
</head>
<body class="page-body" style="height: 100vh; overflow: hidden; display: flex; flex-direction: column;">

    <header class="home-nav" style="flex-shrink: 0;">
        <div class="nav-brand">
            <a data-route="/home/"><img src="../headerlogo.png" alt="Interactive Studio" class="brand-logo"></a>
            <span class="brand-name">Studio AI Hub</span>
        </div>
        <nav class="nav-links">
            <a data-route="/dashboard/">Dashboard</a>
            <a data-route="/editor/">Editor</a>
        </nav>
        <div class="nav-actions">
            <select id="model-selector" onchange="handleModelSelect(this.value)" style="padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 0.85rem; font-weight: 600;">
                <option value="gemini">Gemini 2.5 Flash (Free)</option>
                <option value="copilot">Microsoft Copilot Mini (Free)</option>
                <option value="chatgpt">ChatGPT-4o (Pro / Paid)</option>
                <option value="claude">Claude 3.5 Sonnet (Pro / Paid)</option>
            </select>
            <button onclick="openApiKeyModal()" class="btn-secondary-small">⚙️ API Key</button>
            <a data-route="/dashboard/" class="btn-secondary-small">Exit Hub</a>
        </div>
    </header>

    <div style="display: flex; flex: 1; overflow: hidden; background: var(--bg-subtle);">
        <main style="flex: 1; display: flex; flex-direction: column; background: var(--bg-main);">
            <div id="chat-messages" style="flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; max-width: 800px; width: 100%; margin: 0 auto;">
                <div style="display: flex; gap: 12px; align-items: flex-start;">
                    <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--brand-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;">AI</div>
                    <div style="background: var(--bg-subtle); border: 1px solid var(--border-color); padding: 1rem 1.25rem; border-radius: 12px; font-size: 0.95rem;">
                        Hello! I am your AI assistant connected to the Gemini API. Type your presentation prompt below or click <strong>API Key</strong> to provide your custom Google AI Studio key.
                    </div>
                </div>
            </div>

            <div style="padding: 1.5rem; background: var(--bg-main); border-top: 1px solid var(--border-color); display: flex; justify-content: center;">
                <form id="chat-form" style="max-width: 800px; width: 100%; display: flex; gap: 10px;" onsubmit="sendGeminiMessage(event)">
                    <input type="text" id="chat-input" placeholder="Ask AI to design slides or write copy..." style="flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.95rem;" required autocomplete="off">
                    <button type="submit" class="btn-primary-small" style="padding: 0 20px;">Send Prompt →</button>
                </form>
            </div>
        </main>
    </div>

    <!-- API Key Modal -->
    <div id="api-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: #fff; padding: 2rem; border-radius: 12px; width: 400px; display: flex; flex-direction: column; gap: 1rem;">
            <h3>Configure Gemini API Key</h3>
            <p style="font-size: 0.85rem; color: var(--text-sub);">Enter your Google AI Studio API key for direct live generation.</p>
            <input type="password" id="gemini-key-input" placeholder="AIzaSy..." style="padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85rem;">
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="document.getElementById('api-modal').style.display='none'" class="btn-secondary-small">Cancel</button>
                <button onclick="saveApiKey()" class="btn-primary-small">Save Key</button>
            </div>
        </div>
    </div>

    <script>
        const auth = firebase.auth();
        auth.onAuthStateChanged((user) => {
            if (!user && !sessionStorage.getItem("is_user_email")) {
                window.location.href = window.getAppUrl('/auth/personal/login/');
            }
        });

        function openApiKeyModal() { document.getElementById('api-modal').style.display = 'flex'; }
        function saveApiKey() {
            const key = document.getElementById('gemini-key-input').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert("API Key saved securely in browser storage!");
                document.getElementById('api-modal').style.display = 'none';
            }
        }

        function handleModelSelect(val) {
            const userPlan = sessionStorage.getItem("is_user_plan") || "Free";
            const paidModels = ["chatgpt", "claude"];
            if (paidModels.includes(val) && (userPlan === "Free" || userPlan === "Basic")) {
                alert("🔒 This model is locked on the Free tier. Please upgrade on the Pricing page to unlock ChatGPT-4o and Claude 3.5 Sonnet.");
                document.getElementById("model-selector").value = "gemini";
            }
        }

        async function sendGeminiMessage(e) {
            e.preventDefault();
            const input = document.getElementById("chat-input");
            const container = document.getElementById("chat-messages");
            const text = input.value;
            const apiKey = localStorage.getItem('gemini_api_key');

            container.innerHTML += `<div style="display:flex; justify-content:flex-end;"><div style="background:var(--text-main); color:#fff; padding:10px 14px; border-radius:8px;">${text}</div></div>`;
            input.value = "";
            container.scrollTop = container.scrollHeight;

            const bubbleId = 'ai-resp-' + Date.now();
            container.innerHTML += `<div style="display:flex; gap:12px;" id="${bubbleId}"><div style="width:32px;height:32px;border-radius:50%;background:var(--brand-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;">AI</div><div style="background:var(--bg-subtle);border:1px solid var(--border-color);padding:10px 14px;border-radius:8px;color:var(--text-sub);">Thinking...</div></div>`;
            container.scrollTop = container.scrollHeight;

            if (!apiKey) {
                setTimeout(() => {
                    document.getElementById(bubbleId).querySelector('div:nth-child(2)').innerHTML = `<strong>Demo Mode (No API Key provided):</strong> I've analyzed your prompt regarding "${text}". To connect to the live Gemini 2.5 Flash API, click <strong>API Key</strong> in the header and paste your Google AI Studio key!`;
                    document.getElementById(bubbleId).querySelector('div:nth-child(2)').style.color = 'var(--text-main)';
                    container.scrollTop = container.scrollHeight;
                }, 800);
                return;
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                });
                const data = await response.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
                document.getElementById(bubbleId).querySelector('div:nth-child(2)').textContent = reply;
                document.getElementById(bubbleId).querySelector('div:nth-child(2)').style.color = 'var(--text-main)';
            } catch (err) {
                document.getElementById(bubbleId).querySelector('div:nth-child(2)').textContent = "API Error: " + err.message;
            }
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
