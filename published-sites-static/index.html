<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8fc">
<title>Published website | Interactive Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7f8fc;color:#252638;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#status{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);padding:34px;background:#fff;border:1px solid #e7e8f0;border-radius:20px;box-shadow:0 18px 60px #25263812}h1{font-size:clamp(28px,6vw,42px);letter-spacing:-.055em;margin:0 0 12px}p{color:#686d80;line-height:1.7}.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:99px;background:#f0efff;color:#6259dd;font-size:12px;font-weight:800;margin-bottom:18px}.dot{width:8px;height:8px;border-radius:50%;background:#635bff}a{color:#635bff;font-weight:700}body.site{background:var(--site-bg,#f7f8fc);color:var(--site-text,#252638)}body.site #status{display:block;min-height:0;padding:0}.site-section{padding:54px 8%;overflow-wrap:anywhere}.site-section h1{font-size:clamp(38px,7vw,82px);line-height:1.03;letter-spacing:-.07em;margin:18px 0}.site-section h2{font-size:clamp(24px,4vw,36px);letter-spacing:-.04em}.site-section p{font-size:16px;line-height:1.8;white-space:pre-wrap;color:inherit}.site-section img{display:block;max-width:100%;max-height:440px;object-fit:cover;border-radius:14px;margin:18px auto}.site-section a.button{display:inline-block;margin-top:14px;padding:13px 20px;background:var(--site-accent,#635bff);color:white;text-decoration:none;border-radius:10px;font-weight:750}.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.feature{padding:20px;border:1px solid #e7e8f0;border-radius:12px;font-weight:700}footer{text-align:center;padding:25px;color:#9295a5;font-size:11px}@media(max-width:600px){.site-section{padding-left:22px;padding-right:22px}}
</style>
</head>
<body>
<main id="status"><section class="card"><div class="pill"><span class="dot"></span> Interactive Studio publishing</div><h1>Loading your website…</h1><p>Just a moment while we fetch the published page.</p></section></main>
<script>
const PROJECT="interactive-studio-convexllc";
const API_KEY="AIzaSyAHQDuRXq77XRZvnE-dDuoy8A1TLLtfSy8";
const SUFFIX=".websites.is-sites.abrdns.com";
function decode(v){if(!v||typeof v!=="object")return null;if("stringValue"in v)return v.stringValue;if("booleanValue"in v)return v.booleanValue;if("integerValue"in v)return Number(v.integerValue);if("doubleValue"in v)return Number(v.doubleValue);if("timestampValue"in v)return v.timestampValue;if("nullValue"in v)return null;if(v.arrayValue)return(v.arrayValue.values||[]).map(decode);if(v.mapValue)return fields(v.mapValue.fields||{});return null}
function fields(obj){const out={};for(const [k,v] of Object.entries(obj||{}))out[k]=decode(v);return out}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function colour(v,f){return /^#[0-9a-f]{6}$/i.test(String(v||""))?v:f}
function link(v){try{const u=new URL(String(v||"").trim());return["https:","http:","mailto:"].includes(u.protocol)?u.href:""}catch(_){return""}}
function sectionHTML(s,site){const bg=colour(s.background,"#fff"),accent=colour(s.accent,colour(site.accent,"#635bff")),text=colour(site.textColour,"#252638"),align=["left","center","right"].includes(s.align)?s.align:"center",base=' style="background:'+bg+';color:'+text+';text-align:'+align+'"';if(s.type==="hero")return'<section class="site-section"'+base+'><div style="color:'+accent+';font-size:11px;font-weight:850;letter-spacing:.16em">'+esc(s.eyebrow||"")+'</div><h1>'+esc(s.title||site.siteName||"Website")+'</h1><p style="font-size:clamp(17px,2.2vw,23px);max-width:760px;margin:0 auto">'+esc(s.text||"")+'</p></section>';if(s.type==="text")return'<section class="site-section"'+base+'><h2>'+esc(s.title||"")+'</h2><p>'+esc(s.text||"")+'</p></section>';if(s.type==="image"){let src="";try{const u=new URL(s.imageUrl||"");if(u.protocol==="https:")src=u.href}catch(_){}return'<section class="site-section"'+base+'><h2>'+esc(s.title||"")+'</h2>'+(src?'<img src="'+esc(src)+'" alt="">':"")+'<p>'+esc(s.text||"")+'</p></section>'}if(s.type==="button"){const href=link(s.buttonUrl);return'<section class="site-section"'+base+'><h2>'+esc(s.title||"")+'</h2>'+(href?'<a class="button" href="'+esc(href)+'">'+esc(s.buttonLabel||"Learn more")+'</a>':"")+'</section>'}if(s.type==="features")return'<section class="site-section"'+base+'><h2>'+esc(s.title||"Features")+'</h2><div class="features">'+(Array.isArray(s.features)?s.features.slice(0,6):[]).map(x=>'<div class="feature">'+esc(x)+'</div>').join("")+'</div></section>';return""}
function showError(title,message){document.title=title;document.getElementById("status").innerHTML='<section class="card"><div class="pill"><span class="dot"></span> Interactive Studio</div><h1>'+esc(title)+'</h1><p>'+esc(message)+'</p><p><a href="https://is-sites.abrdns.com/">Visit Interactive Studio</a></p></section>'}
async function start(){const params=new URLSearchParams(location.search);let slug=params.get("preview")||"";if(!slug){const host=location.hostname.toLowerCase();if(!host.endsWith(SUFFIX)){showError("Publishing service ready","This is the publishing service. Open a published website address to view a site.");return}slug=host.slice(0,-SUFFIX.length);if(slug.includes(".")){showError("Website not found","This address is not a valid website address.");return}}if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)){showError("Invalid website address","The website address contains an invalid name.");return}try{const url="https://firestore.googleapis.com/v1/projects/"+PROJECT+"/databases/(default)/documents/websites/"+encodeURIComponent(slug)+"?key="+encodeURIComponent(API_KEY);const response=await fetch(url,{headers:{Accept:"application/json"}});if(response.status===404){showError("Website not found","This website does not exist or has not been published yet.");return}if(!response.ok)throw new Error("Firestore returned HTTP "+response.status);const site=fields((await response.json()).fields||{});if(site.status!=="published"){showError("Website not published","The owner has not published this website yet.");return}const title=esc(site.siteName||site.title||"Website"),bg=colour(site.background,"#f7f8fc"),accent=colour(site.accent,"#635bff"),text=colour(site.textColour,"#252638");let sections=Array.isArray(site.sections)&&site.sections.length?site.sections:[{type:"hero",eyebrow:site.eyebrow||"",title:site.headline||title,text:site.subheadline||"",background:bg,accent,align:"center"},...(site.body?[{type:"text",title:"About",text:site.body}]:[]),...(site.buttonLabel?[{type:"button",title:"",buttonLabel:site.buttonLabel,buttonUrl:site.buttonUrl}]:[])];document.title=site.siteName||"Website";document.body.className="site";document.documentElement.style.setProperty("--site-bg",bg);document.documentElement.style.setProperty("--site-text",text);document.documentElement.style.setProperty("--site-accent",accent);document.getElementById("status").innerHTML=sections.map(s=>sectionHTML(s,site)).join("")+'<footer>Published with <a href="https://is-sites.abrdns.com/">Interactive Studio</a></footer>'}catch(e){console.error(e);showError("Couldn't load this website",e.message||"Please try again in a moment.")}}
start();
</script>
</body>
</html>
