*{box-sizing:border-box}.work{height:calc(100vh - 64px);min-height:650px;background:#eef0f5;display:flex;flex-direction:column;color:#202431}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:white;padding:10px 16px;border-bottom:1px solid #e1e4eb;flex-wrap:wrap}.bar input{padding:9px;border:1px solid #e1e4eb;border-radius:7px;font-weight:700}.btn{padding:9px 12px;border:1px solid #dfe3eb;background:white;border-radius:8px;cursor:pointer;font-weight:650;font-size:12px}.primary{background:#5267d8;color:white;border-color:#5267d8}.layout{display:grid;grid-template-columns:205px minmax(0,1fr) 240px;flex:1;min-height:0}.side{background:white;padding:14px;border-right:1px solid #e1e4eb;overflow:auto}.right{border:0;border-left:1px solid #e1e4eb}.label{font-size:10px;letter-spacing:.13em;color:#8991a2;font-weight:800;margin:8px 0 12px}.thumb{display:block;width:100%;text-align:left;padding:7px;margin:7px 0;border:2px solid transparent;border-radius:8px;background:#f7f8fa;cursor:pointer}.thumb.active{border-color:#5267d8}.thumb b{display:block;font-size:11px}.thumb small{color:#788092}.stage{display:flex;flex-direction:column;min-width:0}.tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:white;border-bottom:1px solid #e1e4eb}.tools button,.tools select{height:32px;border:1px solid #dfe3eb;border-radius:7px;background:white;padding:4px 8px}.canvas-wrap{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:25px}.canvas{width:min(100%,950px);aspect-ratio:16/9;background:white;padding:8%;display:flex;flex-direction:column;justify-content:center;gap:15px;box-shadow:0 14px 45px #20294220}.canvas [contenteditable]{outline:1px dashed transparent}.canvas [contenteditable]:focus{outline-color:#aab4ed}.kicker{font-size:11px;font-weight:800;letter-spacing:.15em;color:#5267d8}.heading{font-size:clamp(25px,4vw,58px);line-height:1.04;letter-spacing:-.05em}.copy{font-size:clamp(13px,1.6vw,21px);line-height:1.4;color:#606879;max-width:80%}.inspector label{display:block;font-size:11px;font-weight:700;margin:12px 0 5px}.inspector input,.inspector textarea,.inspector select{width:100%;padding:8px;border:1px solid #dfe3eb;border-radius:7px}.inspector textarea{min-height:65px}.choice-row{border:1px solid #e1e4eb;border-radius:8px;padding:8px;margin:8px 0}.status{font-size:10px;color:#27845f}.foot{padding:8px 14px;background:white;border-top:1px solid #e1e4eb;font-size:10px;color:#778092;display:flex;justify-content:space-between}@media(max-width:900px){.layout{grid-template-columns:155px minmax(0,1fr)}.right{display:none}}@media(max-width:620px){.layout{grid-template-columns:1fr}.side{max-height:130px}.thumb{width:120px;display:inline-block}.canvas-wrap{padding:10px;min-height:300px}.bar{align-items:flex-start}}

:root{--brand-blue:#635bff}
body{background:#f5f6fb}
.work{height:calc(100vh - 64px);background:#f3f4f9;color:#252638}

</style></head><body class="page-body"><header class="home-nav"><div class="nav-brand"><a data-route="/home/"><img src="../../assets/images/headerlogo.png" class="brand-logo" alt="Interactive Studio"></a><span class="brand-name">Presentation editor</span></div><div style="display:flex;gap:8px;align-items:center"><a data-route="/settings/" class="btn-secondary-small">Settings</a><a data-route="/dashboard/" class="btn-secondary-small">Workspace</a></div></header>
<div class="work"><div class="bar"><div><input id="title" value="Untitled presentation"><span class="status" id="saved">Saved on this device</span></div><div><button class="btn" id="add">＋ Slide</button> <button class="btn" id="duplicate">Duplicate</button> <button class="btn" id="remove">Delete</button> <button class="btn" id="share">Publish / sync presentation</button> <button class="btn" id="audience">Audience screen ↗</button> <button class="btn primary" id="present">Presenter view ▶</button></div></div>
<div class="layout"><aside class="side"><div class="label">SLIDES</div><div id="slides"></div><button class="btn" id="add2">＋ Add slide</button><div class="label" style="margin-top:20px">INTERACTIVE</div><button class="btn" id="decision">⑂ Add decision</button></aside>

<aside class="side right"><div class="label">SLIDE DESIGN</div><div class="inspector"><label>Background</label><input id="bg" type="color" value="#ffffff"><label>Heading colour</label><input id="ink" type="color" value="#202431"><label>Eyebrow</label><input id="eyebrow" value="INTERACTIVE STUDIO"><label>Private presenter notes</label><textarea id="notes" placeholder="Only the presenter can see these…"></textarea><div class="label" style="margin-top:20px">DECISION SETTINGS</div><label><input id="enabled" type="checkbox" style="width:auto"> Audience can choose</label><div id="decision-settings" hidden><label>Question</label><textarea id="question" placeholder="What should happen next?"></textarea><div id="choices"></div><button class="btn" id="add-choice">＋ Choice</button></div></div></aside></div><div class="foot"><span id="counter">Slide 1 of 1</span><span>Autosaved on this device · 16:9</span></div></div>

<script src="../../assets/Files/firebase-rooms.js"></script><script>
(()=>{const $=x=>document.getElementById(x),id=new URLSearchParams(location.search).get("id")||localStorage.getItem("studio_active_project")||"deck_"+Date.now(),key="studio_deck_"+id;localStorage.setItem("studio_active_project",id);let deck;try{deck=JSON.parse(localStorage.getItem(key)||"null")}catch(e){}const make=(h="A new idea.",c="Add your supporting message here.")=>({heading:h,copy:c,kicker:"INTERACTIVE STUDIO",bg:"#ffffff",ink:"#202431",notes:"",decision:null});if(!deck)deck={id,title:"Untitled presentation",slides:[make("Your next big idea starts here.","Create a story, then invite your audience to shape what happens next.")]};let n=0,channel,cloudCode=localStorage.getItem("studio_room_"+id)||"",cloudTimer;if(cloudCode&&!/^\\d{6}$/.test(cloudCode)){localStorage.removeItem("studio_room_"+id);cloudCode="";}try{channel=new BroadcastChannel("is-studio-"+id)}catch(e){}function s(){return deck.slides[n]}function queueCloudSave(){if(!cloudCode||!window.studioRooms)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(async()=>{try{await studioRooms.updateRoom(cloudCode,deck,n);$("saved").textContent="Saved locally + online"}catch(error){$("saved").textContent="Local save · cloud sync failed";console.error(error)}},1800)}function save(){deck.title=$("title").value||"Untitled presentation";localStorage.setItem(key,JSON.stringify(deck));$("saved").textContent="Saved "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});try{channel?.postMessage({type:"deck",deck,active:n})}catch(e){}queueCloudSave()}function capture(){s().heading=$("heading").innerText;s().copy=$("copy").innerText;s().kicker=$("kicker").innerText;s().bg=$("canvas").style.backgroundColor||s().bg;s().ink=$("heading").style.color||s().ink;s().notes=$("notes").value}function draw(){let x=s();$("title").value=deck.title;$("heading").textContent=x.heading;$("copy").textContent=x.copy;$("kicker").textContent=x.kicker;$("canvas").style.background=x.bg;$("heading").style.color=x.ink;$("bg").value=x.bg;$("bgcolor").value=x.bg;$("ink").value=x.ink;$("textcolor").value=x.ink;$("eyebrow").value=x.kicker;$("notes").value=x.notes||"";$("enabled").checked=!!x.decision;$("decision-settings").hidden=!x.decision;$("question").value=x.decision?.question||"";choices();$("decision-preview").hidden=!x.decision;$("decision-preview").textContent=x.decision?x.decision.question+" · "+x.decision.choices.map(c=>c.label).join(" / "):"";$("counter").textContent="Slide "+(n+1)+" of "+deck.slides.length;$("slides").replaceChildren();deck.slides.forEach((v,i)=>{let b=document.createElement("button");b.className="thumb"+(i===n?" active":"");let t=document.createElement("b");t.textContent=(i+1)+". "+(v.heading||"Untitled");let q=document.createElement("small");q.textContent=v.decision?"⑂ Decision":"Slide";b.append(t,q);b.onclick=()=>{capture();n=i;draw();save()};$("slides").append(b)})}function choices(){let box=$("choices");box.replaceChildren();(s().decision?.choices||[]).forEach((c,i)=>{let d=document.createElement("div");d.className="choice-row";let a=document.createElement("input");a.value=c.label;a.placeholder="Choice label";a.oninput=()=>{c.label=a.value;save()};let type=document.createElement("select");type.innerHTML='<option value="slide">Jump to slide</option><option value="message">Show message</option>';type.value=c.action||"slide";type.onchange=()=>{c.action=type.value;draw();save()};d.append(a,type);if(c.action==="message"){let m=document.createElement("textarea");m.placeholder="Message shown to audience";m.value=c.message||"";m.oninput=()=>{c.message=m.value;save()};d.append(m)}else{let sel=document.createElement("select");deck.slides.forEach((v,j)=>{let o=document.createElement("option");o.value=j;o.textContent="Slide "+(j+1)+" · "+v.heading;sel.append(o)});sel.value=c.target??Math.min(n+1,deck.slides.length-1);sel.onchange=()=>{c.target=+sel.value;save()};d.append(sel)}let del=document.createElement("button");del.className="btn";del.textContent="Remove";del.onclick=()=>{s().decision.choices.splice(i,1);draw();save()};d.append(del);box.append(d)})}
["heading","copy","kicker","title"].forEach(k=>$(k).addEventListener("input",()=>{capture();save()}));$("eyebrow").oninput=e=>{$("kicker").textContent=e.target.value;capture();save()};$("notes").oninput=()=>{s().notes=$("notes").value;save()};$("add").onclick=$("add2").onclick=()=>{capture();deck.slides.splice(n+1,0,make());n++;draw();save()};$("duplicate").onclick=()=>{capture();deck.slides.splice(n+1,0,JSON.parse(JSON.stringify(s())));n++;draw();save()};$("remove").onclick=()=>{if(deck.slides.length<2){alert("Keep at least one slide.");return}deck.slides.splice(n,1);n=Math.max(0,n-1);draw();save()};$("decision").onclick=()=>{s().decision=s().decision||{question:"What should happen next?",choices:[{label:"Explore option A",action:"slide",target:Math.min(n+1,deck.slides.length-1)},{label:"Explore option B",action:"message",message:"You chose option B!"}]};draw();save()};$("enabled").onchange=e=>{s().decision=e.target.checked?{question:"What should happen next?",choices:[{label:"Option A",action:"slide",target:Math.min(n+1,deck.slides.length-1)},{label:"Option B",action:"message",message:"Thanks for choosing!"}]}:null;draw();save()};$("question").oninput=e=>{s().decision.question=e.target.value;save()};$("add-choice").onclick=()=>{s().decision.choices.push({label:"New choice",action:"slide",target:Math.min(n+1,deck.slides.length-1)});draw();save()};$("bg").oninput=$("bgcolor").oninput=e=>{$("canvas").style.background=e.target.value;s().bg=e.target.value;save()};$("ink").oninput=$("textcolor").oninput=e=>{$("heading").style.color=e.target.value;s().ink=e.target.value;save()};$("bold").onclick=()=>document.execCommand("bold");$("italic").onclick=()=>document.execCommand("italic");$("left").onclick=()=>document.execCommand("justifyLeft");$("center").onclick=()=>document.execCommand("justifyCenter");$("rightalign").onclick=()=>document.execCommand("justifyRight");$("size").onchange=e=>{$("heading").style.fontSize=e.target.value+"px"};function open(path,name){capture();save();window.open(window.getAppUrl(path)+"?id="+encodeURIComponent(id),name+"-"+id,"popup,width=1280,height=850")}$("present").onclick=()=>open("/presentations/view/"+encodeURIComponent(id)+"/presenter/","is-presenter");$("audience").onclick=()=>open("/presentations/view/"+encodeURIComponent(id)+"/audience/","is-audience");$("share").onclick=async()=>{const button=$("share");button.disabled=true;button.textContent="Connecting…";try{if(!cloudCode){const room=await studioRooms.createRoom(deck);cloudCode=room.code;localStorage.setItem("studio_room_"+id,cloudCode)}else{await studioRooms.updateRoom(cloudCode,deck,n)}const url=location.origin+(window.getAppUrl?window.getAppUrl("/view/"+cloudCode):"/view/"+cloudCode);$("saved").textContent="Published · ID "+cloudCode;button.textContent="ID "+cloudCode;try{await navigator.clipboard.writeText(url)}catch(_){} }catch(error){console.error(error);$("saved").textContent=error.message||"Could not create room";button.textContent="Retry room setup"}finally{button.disabled=false}};if(cloudCode){$("share").textContent="Sync ID "+cloudCode;$("saved").textContent="Published ID "+cloudCode+" · changes sync shortly"}
draw();save()})();
