<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audience | Interactive Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#080a10;font-family:Inter,system-ui,Arial;color:white}.app{min-height:100vh;display:flex;flex-direction:column;padding:clamp(14px,3vw,40px)}.presentation-bar{position:fixed;left:0;right:0;bottom:0;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px clamp(16px,3vw,38px);background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-top:1px solid #e5e6ef;color:#686b7c;font-size:12px;z-index:5}.bar-title{font-weight:750;color:#292a3b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar-meta{display:flex;align-items:center;gap:18px;white-space:nowrap}.watermark{font-weight:650;color:#85879a}.app{padding:clamp(14px,3vw,36px);padding-bottom:82px}.slide{flex:1;width:100%;max-width:1500px;max-height:calc(100vh - 110px);aspect-ratio:16/9;margin:auto;background:white;color:#202431;border-radius:12px;padding:clamp(25px,7vw,100px);display:flex;flex-direction:column;justify-content:center;overflow:auto}.kicker{font-size:clamp(10px,1vw,15px);font-weight:800;letter-spacing:.15em;color:#5267d8}.slide h1{font-size:clamp(28px,5vw,76px);line-height:1.03;letter-spacing:-.05em;margin:18px 0}.slide p{font-size:clamp(15px,2vw,27px);line-height:1.4;color:#626b7b;max-width:80%}.decision{margin-top:30px}.decision h2{font-size:clamp(18px,2vw,28px)}.choices{display:flex;gap:12px;flex-wrap:wrap}.choice{background:#5267d8;color:white;border:0;border-radius:10px;padding:14px 20px;font-size:clamp(13px,1.5vw,18px);font-weight:700;cursor:pointer}.choice:disabled{opacity:.5}.feedback{color:#26794f;margin-top:16px;font-size:16px}.blank{margin:auto;text-align:center;color:#cbd1df}.blank p{color:#aeb7c8}@media(max-width:600px){.slide{aspect-ratio:auto;max-height:none;min-height:65vh}}
body{background:#f3f4fa;color:#252638}
.app{padding:clamp(14px,3vw,36px);gap:18px}
.presentation-bar{color:#777b8e}
.slide{border:1px solid #e5e6ef;border-radius:14px;box-shadow:0 24px 70px #24243d18;padding:clamp(28px,7vw,105px)}
.kicker{color:#635bff}
.choice{background:#635bff;border-radius:10px;box-shadow:0 6px 18px #635bff25;transition:transform .16s,box-shadow .16s}
.choice:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 24px #635bff35}
.feedback{color:#16845d}
@media(max-width:600px){.app{padding:12px;padding-bottom:88px}.slide{border-radius:12px;min-height:68vh}.presentation-bar{align-items:flex-start;flex-direction:column;gap:5px;padding:10px 14px}.bar-meta{width:100%;justify-content:space-between;gap:8px;font-size:10px}}
</style></head><body><main class="app"><article class="slide" id="slide"><div class="blank"><h1>Waiting for your presenter</h1><p>The presentation will appear here when it starts.</p></div></article></main><div class="presentation-bar"><span class="bar-title" id="decktitle">Presentation</span><span class="bar-meta"><span id="status">● Waiting for presenter</span><span id="count"></span><span class="watermark">Made with Interactive Studio</span></span></div><script>(()=>{const $=x=>document.getElementById(x),id=new URLSearchParams(location.search).get("id"),key="is_present_state_"+id;let deck,n=0,answered=false,ch;try{ch=new BroadcastChannel("is-studio-"+id)}catch(e){}function draw(){if(!deck)return;let s=deck.slides[n],root=$("slide");root.replaceChildren();root.style.background=s.bg||"#fff";let k=document.createElement("div");k.className="kicker";k.textContent=s.kicker||"";let h=document.createElement("h1");h.textContent=s.heading||"";h.style.color=s.ink||"#202431";let p=document.createElement("p");p.textContent=s.copy||"";root.append(k,h,p);if(s.decision){let d=document.createElement("section");d.className="decision";let q=document.createElement("h2");q.textContent=s.decision.question||"Choose what happens next";let row=document.createElement("div");row.className="choices";(s.decision.choices||[]).forEach(c=>{let b=document.createElement("button");b.className="choice";b.textContent=c.label;b.disabled=answered;b.onclick=()=>{answered=true;row.querySelectorAll("button").forEach(x=>x.disabled=true);ch?.postMessage({type:"vote",vote:{choice:c.label,at:Date.now()}});let f=document.createElement("div");f.className="feedback";f.textContent="Your choice has been sent to the presenter. Thank you!";d.append(f)};row.append(b)});d.append(q,row);root.append(d)}$("decktitle").textContent=deck.title||"Audience display";$("count").textContent="Slide "+(n+1)+" / "+deck.slides.length;$("status").textContent="● Connected"}if(ch){ch.onmessage=e=>{let m=e.data||{};if(m.type==="state"){deck=m.deck;n=m.active||0;answered=false;draw()}if(m.type==="reset"){answered=false;draw()}if(m.type==="outcome"){let d=document.createElement("div");d.className="feedback";d.textContent=m.message;$("slide").append(d)}};ch.postMessage({type:"ready"})}window.addEventListener("storage",e=>{if(e.key===key&&e.newValue){try{let x=JSON.parse(e.newValue);deck=x.deck;n=x.active||0;answered=false;draw()}catch(_){}}});try{let x=JSON.parse(localStorage.getItem(key)||"null");if(x){deck=x.deck;n=x.active||0;draw()}}catch(_){}})();</script><script src="../../../assets/Files/firebase-rooms.js"></script><script src="../../../assets/Files/remote-audience.js"></script></body></html>
