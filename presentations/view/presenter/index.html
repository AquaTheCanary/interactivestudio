<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presenter | Interactive Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#10141d;color:#fff;font-family:Inter,system-ui,Arial}.app{min-height:100vh;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:15px}.panel{background:#1b2230;border:1px solid #30394a;border-radius:14px;padding:16px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.screen{aspect-ratio:16/9;background:#fff;color:#202431;border-radius:9px;margin-top:15px;padding:8%;display:flex;flex-direction:column;justify-content:center}.screen h1{font-size:clamp(25px,4vw,60px);line-height:1.05;letter-spacing:-.05em}.screen p{font-size:clamp(13px,1.6vw,22px);color:#626b7b;margin-top:16px}.btn{background:#303b50;color:white;border:1px solid #4a5870;padding:10px 13px;border-radius:8px;cursor:pointer}.primary{background:#5267d8;border-color:#5267d8}.controls{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}.notes{background:#252e3e;padding:13px;border-radius:9px;margin-top:13px;white-space:pre-wrap;font-size:13px;color:#dce2ed}.link{width:100%;padding:10px;background:#101722;color:white;border:1px solid #4a5870;border-radius:8px;margin:10px 0}.responses{display:grid;gap:7px;margin-top:12px}.response{padding:10px;background:#252e3e;border-radius:8px;font-size:12px}.muted{font-size:12px;color:#b7c0d0}@media(max-width:780px){.app{grid-template-columns:1fr}.panel.side{order:-1}}
:root{font-family:Inter,system-ui,sans-serif}
body{background:#f4f5fa;color:#242536;padding-bottom:54px}.presenter-bottom{position:fixed;left:0;right:0;bottom:0;min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 22px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-top:1px solid #e7e8f0;color:#85889a;font-size:11px;z-index:10}.presenter-bottom span:first-child{font-weight:750;color:#35364a}.presenter-bottom span:last-child{font-weight:650}@media(max-width:600px){.presenter-bottom{padding:9px 12px;font-size:9px;gap:7px}}
.app{max-width:1600px;margin:auto;padding:24px;gap:18px;grid-template-columns:minmax(0,1fr) 320px}
.panel{background:#fff;color:#252638;border:1px solid #e7e8f0;border-radius:16px;padding:20px;box-shadow:0 8px 30px #25254408}
.muted{color:#85889a}.screen{border-radius:10px;box-shadow:0 12px 35px #24243d18;margin-top:20px}
.btn{background:#fff;color:#424458;border:1px solid #e4e5ed;border-radius:9px;transition:.18s}
.btn:hover{background:#f8f7ff;border-color:#c4c0ff}.primary{background:#635bff;color:#fff;border-color:#635bff}
.notes{background:#f6f6fb;color:#666a7d;border:1px solid #ececf3;border-radius:10px}
.link{background:#fafaff;color:#55596d;border:1px solid #e5e6ef;border-radius:9px}
.response{background:#f5f5fb;color:#4b4e62;border:1px solid #ececf3;border-radius:9px}
@media(max-width:780px){.app{padding:12px;grid-template-columns:1fr}.panel{padding:15px}}
</style></head><body><main class="app"><section class="panel"><div class="top"><div><b id="present-title">Presenter controls</b><div class="muted" id="status">Connecting…</div></div><button class="btn" id="open">Open audience ↗</button></div><article class="screen" id="screen"><div id="kicker" style="color:#5267d8;font-size:11px;font-weight:800;letter-spacing:.15em"></div><h1 id="heading">Loading…</h1><p id="copy"></p><h3 id="question"></h3><div id="choices"></div></article><div class="controls"><button class="btn" id="prev">← Previous</button><button class="btn primary" id="next">Next →</button><button class="btn" id="reset">Reset votes</button><span class="muted" id="counter"></span></div><div class="notes" id="notes">Private notes will appear here.</div></section><aside class="panel side"><h2>Audience display</h2><p class="muted">Open this on your projector or second screen. It shows slides and decision choices, never your notes or presenter controls.</p><input class="link" id="url" readonly><button class="btn primary" id="copy">Copy audience link</button><h2 style="margin-top:24px">Live audience responses</h2><p class="muted" id="summary">No responses yet.</p><div class="responses" id="responses"></div><p id="outcome"></p></aside></main><div class="presenter-bottom"><span id="presenter-deck-title"></span><span id="presenter-slide-info"></span><span>Made with Interactive Studio</span></div><script src="../../../assets/Files/firebase-rooms.js"></script><script>(()=>{const $=x=>document.getElementById(x),id=new URLSearchParams(location.search).get("id"),key="studio_deck_"+id;let deck;try{deck=JSON.parse(localStorage.getItem(key)||"null")}catch(e){}if(!deck){$("heading").textContent="Presentation not found";return}let n=0,votes=[],channel,roomCode=localStorage.getItem("studio_room_"+id)||"",stopRoom,stopVotes;try{channel=new BroadcastChannel("is-studio-"+id)}catch(e){}const audienceBase=location.origin+(window.getAppUrl?window.getAppUrl("/audience/"):"/interactivestudio/audience/");const audience=audienceBase+(roomCode?"?room="+encodeURIComponent(roomCode):"?id="+encodeURIComponent(id));$("url").value=audience;function send(){channel?.postMessage({type:"state",deck,active:n});localStorage.setItem("is_present_state_"+id,JSON.stringify({deck,active:n,stamp:Date.now()}));if(roomCode)studioRooms.saveActiveSlide(roomCode,n).catch(error=>{$("status").textContent="Cloud sync error: "+error.message})}function draw(){let s=deck.slides[n];$("present-title").textContent=deck.title||"Presenter controls";$("presenter-deck-title").textContent=deck.title||"Untitled presentation";$("presenter-slide-info").textContent="Slide "+(n+1)+" / "+deck.slides.length;$("screen").style.background=s.bg||"#fff";$("kicker").textContent=s.kicker||"";$("heading").textContent=s.heading||"";$("heading").style.color=s.ink||"#202431";$("copy").textContent=s.copy||"";$("notes").textContent=s.notes||"No private notes on this slide.";$("question").textContent=s.decision?.question||"";$("choices").replaceChildren();(s.decision?.choices||[]).forEach(c=>{let b=document.createElement("span");b.textContent=c.label;b.style.cssText="display:inline-block;background:#edf0ff;color:#27346f;border-radius:7px;padding:7px 10px;margin:5px;font-size:12px";$("choices").append(b)});$("counter").textContent="Slide "+(n+1)+" / "+deck.slides.length;send()}function go(i){n=Math.max(0,Math.min(deck.slides.length-1,i));votes=[];draw();showVotes()}function showVotes(){$("summary").textContent=votes.length+" response(s) received";$("responses").replaceChildren();votes.forEach(v=>{let d=document.createElement("div");d.className="response";d.textContent=v.choice+" · "+new Date(v.at).toLocaleTimeString();$("responses").append(d)})}$("prev").onclick=()=>go(n-1);$("next").onclick=()=>go(n+1);$("reset").onclick=async()=>{const button=$("reset");button.disabled=true;try{if(roomCode)await studioRooms.resetVotes(roomCode);votes=[];showVotes();channel?.postMessage({type:"reset"});$("status").textContent="Votes reset"}catch(error){$("status").textContent="Could not reset votes: "+error.message}finally{button.disabled=false}};$("open").onclick=()=>window.open(audience,"is-audience-"+id,"popup,width=1280,height=850");$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(audience);$("copy").textContent="Copied"}catch(e){$("url").select()}};if(channel)channel.onmessage=e=>{let m=e.data||{};if(m.type==="ready"){$("status").textContent="Audience screen connected";send()}if(m.type==="deck"){deck=m.deck;n=m.active||0;draw()}if(m.type==="vote"){votes.push(m.vote);showVotes();let c=deck.slides[n].decision?.choices?.find(x=>x.label===m.vote.choice);if(c?.action==="slide")go(Number(c.target)||0);if(c?.action==="message"){$("outcome").textContent=c.message||"Choice received";channel.postMessage({type:"outcome",message:c.message||"Choice received"})}}};window.addEventListener("storage",e=>{if(e.key==="is_present_state_"+id&&e.newValue){try{let x=JSON.parse(e.newValue);deck=x.deck;n=x.active;draw()}catch(_){}}});document.onkeydown=e=>{if(e.key==="ArrowRight")go(n+1);if(e.key==="ArrowLeft")go(n-1)};draw();if(roomCode){$("status").textContent="Connecting to room "+roomCode+"…";studioRooms.ready().then(()=>studioRooms.getNotes(roomCode)).then(notes=>{notes.forEach(item=>{if(deck.slides[item.slideIndex])deck.slides[item.slideIndex].notes=item.notes||""});draw()}).catch(error=>{$("status").textContent="Private notes unavailable: "+error.message});stopRoom=studioRooms.subscribeRoom(roomCode,room=>{if(!room)return;deck={id:deck.id,title:room.title,slides:room.slides.map((slide,i)=>({...slide,notes:deck.slides[i]?.notes||""}))};n=Math.max(0,Math.min(room.activeSlide||0,deck.slides.length-1));draw()});let knownVoteIds=new Set(),initialVoteSnapshot=true;stopVotes=studioRooms.subscribeVotes(roomCode,items=>{const newVotes=initialVoteSnapshot?[]:items.filter(v=>!knownVoteIds.has(v.id));items.forEach(v=>knownVoteIds.add(v.id));initialVoteSnapshot=false;votes=items.map(v=>({choice:v.choice,at:v.createdAt?.toDate?v.createdAt.toDate().getTime():Date.now()}));showVotes();newVotes.forEach(v=>{const sourceSlide=deck.slides[v.slideIndex];const selected=sourceSlide?.decision?.choices?.find(choice=>choice.label===v.choice);if(!selected)return;if(selected.action==="slide"){go(Number(selected.target)||0)}else if(selected.action==="message"){$("outcome").textContent=selected.message||"Choice received"}})},error=>{$("status").textContent="Vote sync error: "+error.message})}})();</script></body></html>
