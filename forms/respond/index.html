<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Respond | Interactive Studio Forms</title><link rel="stylesheet" href="../../assets/Files/style.css"><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="../../assets/Files/auth-config.js"></script><style>.wrap{width:min(700px,calc(100% - 32px));margin:60px auto}.card{background:#fff;border:1px solid var(--border-color);border-radius:16px;padding:clamp(22px,5vw,42px)}.card h1{font-size:clamp(28px,5vw,40px);letter-spacing:-1.5px}.card p{color:var(--text-sub);font-size:13px;line-height:1.7}.answer{display:grid;gap:7px;margin-top:20px}.answer label{font-size:12px;font-weight:700}.answer input,.answer textarea,.answer select{width:100%;padding:12px;border:1px solid var(--border-color);border-radius:9px;font:inherit;font-size:13px}.answer textarea{min-height:100px}</style></head><body class="page-body"><main class="wrap"><section class="card" id="card"><div class="section-kicker">INTERACTIVE STUDIO FORMS</div><h1>Loading form…</h1></section></main><script>(async()=>{const card=document.getElementById("card"),id=new URLSearchParams(location.search).get("id"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));try{if(!id)throw Error("This form link is incomplete.");const db=firebase.firestore(),snap=await db.collection("forms").doc(id).get();if(!snap.exists||!snap.data().published)throw Error("This form is unavailable or has not been published.");const form=snap.data();card.innerHTML='<div class="section-kicker">INTERACTIVE STUDIO FORMS</div><h1>'+esc(form.title)+'</h1><p>'+esc(form.description||"")+'</p><form id="form">'+(form.fields||[]).map((f,i)=>'<div class="answer"><label for="a'+i+'">'+esc(f.label)+(f.required?" *":"")+'</label>'+(f.type==="textarea"?'<textarea id="a'+i+'" '+(f.required?"required":"")+'></textarea>':f.type==="select"?'<select id="a'+i+'" '+(f.required?"required":"")+'><option value="">Choose…</option>'+(f.options||[]).map(o=>'<option>'+esc(o)+'</option>').join("")+'</select>':f.type==="checkbox"?'<input id="a'+i+'" type="checkbox" style="width:auto" '+(f.required?"required":"")+'>':'<input id="a'+i+'" type="'+(f.type==="email"?"email":"text")+'" '+(f.required?"required":"")+'>' )+'</div>').join("")+'<button class="btn-primary-large" style="margin-top:22px">Submit response</button><p id="status" role="status"></p></form>';document.getElementById("form").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;const answers={};form.fields.forEach((f,i)=>{const el=document.getElementById("a"+i);answers[f.label]=f.type==="checkbox"?el.checked:el.value});try{await db.collection("formResponses").add({formId:id,answers,createdAt:firebase.firestore.FieldValue.serverTimestamp()});card.innerHTML='<div class="section-kicker">RESPONSE RECEIVED</div><h1>Thank you.</h1><p>Your response has been submitted successfully.</p>'}catch(err){document.getElementById("status").textContent="Could not submit: "+err.message;b.disabled=false}}}catch(e){card.innerHTML='<div class="section-kicker">INTERACTIVE STUDIO FORMS</div><h1>Form unavailable</h1><p>'+esc(e.message)+'</p>'}})();</script></body></html>
