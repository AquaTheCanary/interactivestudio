<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presenter | Interactive Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#10141d;color:#fff;font-family:Inter,system-ui,Arial}.app{min-height:100vh;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:15px}.panel{background:#1b2230;border:1px solid #30394a;border-radius:14px;padding:16px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.screen{aspect-ratio:16/9;background:#fff;color:#202431;border-radius:9px;margin-top:15px;padding:8%;display:flex;flex-direction:column;justify-content:center}.screen h1{font-size:clamp(25px,4vw,60px);line-height:1.05;letter-spacing:-.05em}.screen p{font-size:clamp(13px,1.6vw,22px);color:#626b7b;margin-top:16px}.btn{background:#303b50;color:white;border:1px solid #4a5870;padding:10px 13px;border-radius:8px;cursor:pointer}.primary{background:#5267d8;border-color:#5267d8}.controls{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}.notes{background:#252e3e;padding:13px;border-radius:9px;margin-top:13px;white-space:pre-wrap;font-size:13px;color:#dce2ed}.link{width:100%;padding:10px;background:#101722;color:white;border:1px solid #4a5870;border-radius:8px;margin:10px 0}.responses{display:grid;gap:7px;margin-top:12px}.response{padding:10px;background:#252e3e;border-radius:8px;font-size:12px}.muted{font-size:12px;color:#b7c0d0}@media(max-width:780px){.app{grid-template-columns:1fr}.panel.side{order:-1}}</style></head><body><main class="app"><section class="panel"><div class="top"><div><b>Interactive Studio · Presenter control</b><div class="muted" id="status">Connecting…</div></div><button class="btn" id="open">Open audience ↗</button></div><article class="screen" id="screen"><div id="kicker" style="color:#5267d8;font-size:11px;font-weight:800;letter-spacing:.15em"></div><h1 id="heading">Loading…</h1><p id="copy"></p><h3 id="question"></h3><div id="choices"></div></article><div class="controls"><button class="btn" id="prev">← Previous</button><button class="btn primary" id="next">Next →</button><button class="btn" id="reset">Reset votes</button><span class="muted" id="counter"></span></div><div class="notes" id="notes">Private notes will appear here.</div></section><aside class="panel side"><h2>Audience display</h2><p class="muted">Open this on your projector or second screen. It shows slides and decision choices, never your notes or presenter controls.</p><input class="link" id="url" readonly><button class="btn primary" id="copy">Copy audience link</button><h2 style="margin-top:24px">Live audience responses</h2><p class="muted" id="summary">No responses yet.</p><div class="responses" id="responses"></div><p id="outcome"></p></aside></main><script>(()=>{const $=x=>document.getElementById(x),id=new URLSearchParams(location.search).get("id"),key="studio_deck_"+id;let deck;try{deck=JSON.parse(localStorage.getItem(key)||"null")}catch(e){}if(!deck){$("heading").textContent="Presentation not found";return}let n=0,votes=[],channel;try{channel=new BroadcastChannel("is-studio-"+id)}catch(e){}const audience=location.origin+(window.getAppUrl?window.getAppUrl("/audience/"):"/interactivestudio/audience/")+"?id="+encodeURIComponent(id);$("url").value=audience;function send(){channel?.postMessage({type:"state",deck,active:n});localStorage.setItem("is_present_state_"+id,JSON.stringify({deck,active:n,stamp:Date.now()}))}function draw(){let s=deck.slides[n];$("screen").style.background=s.bg||"#fff";$("kicker").textContent=s.kicker||"";$("heading").textContent=s.heading||"";$("heading").style.color=s.ink||"#202431";$("copy").textContent=s.copy||"";$("notes").textContent=s.notes||"No private notes on this slide.";$("question").textContent=s.decision?.question||"";$("choices").replaceChildren();(s.decision?.choices||[]).forEach(c=>{let b=document.createElement("span");b.textContent=c.label;b.style.cssText="display:inline-block;background:#edf0ff;color:#27346f;border-radius:7px;padding:7px 10px;margin:5px;font-size:12px";$("choices").append(b)});$("counter").textContent="Slide "+(n+1)+" / "+deck.slides.length;send()}function go(i){n=Math.max(0,Math.min(deck.slides.length-1,i));votes=[];draw();showVotes()}function showVotes(){$("summary").textContent=votes.length+" response(s) received";$("responses").replaceChildren();votes.forEach(v=>{let d=document.createElement("div");d.className="response";d.textContent=v.choice+" · "+new Date(v.at).toLocaleTimeString();$("responses").append(d)})}$("prev").onclick=()=>go(n-1);$("next").onclick=()=>go(n+1);$("reset").onclick=()=>{votes=[];showVotes();channel?.postMessage({type:"reset"})};$("open").onclick=()=>window.open(audience,"is-audience-"+id,"popup,width=1280,height=850");$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(audience);$("copy").textContent="Copied"}catch(e){$("url").select()}};if(channel)channel.onmessage=e=>{let m=e.data||{};if(m.type==="ready"){$("status").textContent="Audience screen connected";send()}if(m.type==="vote"){votes.push(m.vote);showVotes();let c=deck.slides[n].decision?.choices?.find(x=>x.label===m.vote.choice);if(c?.action==="slide")go(Number(c.target)||0);if(c?.action==="message"){$("outcome").textContent=c.message||"Choice received";channel.postMessage({type:"outcome",message:c.message||"Choice received"})}}};window.addEventListener("storage",e=>{if(e.key==="is_present_state_"+id&&e.newValue){try{let x=JSON.parse(e.newValue);deck=x.deck;n=x.active;draw()}catch(_){}}});document.onkeydown=e=>{if(e.key==="ArrowRight")go(n+1);if(e.key==="ArrowLeft")go(n-1)};draw()})();</script></body></html>
